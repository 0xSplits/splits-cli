name: "Docker Push"

on:
  push:
    branches-ignore:
      - "dependabot/**"
    tags:
      - "v*.*.*"

env:
  IMAGE_REPOSITORY: "mcp"

jobs:
  docker-push:
    permissions:
      contents: "read"

    runs-on: "ubuntu-latest"
    steps:
      - name: "Authorize Container Registry"
        uses: "docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550" # v4.8.0
        with:
          registry: "${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          username: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          password: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - name: "Setup Build Environment"
        uses: "docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003" # v4.4.0

      - name: "Compute Image Tag"
        id: image
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Push Docker Image"
        uses: "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc" # v7.4.0
        with:
          push: true
          tags: "${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.tag }}"
